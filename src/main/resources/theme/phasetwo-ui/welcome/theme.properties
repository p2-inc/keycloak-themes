parent=keycloak
import=common/keycloak

# Show a neutral page instead of redirecting to the Administration Console once an
# administrative user exists. Templates, styles and resources come from the parent theme.
redirectToAdmin=false

# The parent's PatternFly styles still dress the bootstrap (create-admin) form. The neutral page
# is styled by css/phasetwo-welcome.css after the default look of the phasetwo-ui login theme.
styles=css/welcome.css css/phasetwo-welcome.css
