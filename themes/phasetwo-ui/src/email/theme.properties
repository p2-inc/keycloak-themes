parent=mustache

# The parent supplies the templates this theme does not ship (magic link, OTP), but its
# templateType=mustache would otherwise make every mustache template in the chain win over
# this theme's own .ftl -- including template.ftl, the branded shell. Declaring the engine
# here keeps the shell and the action templates in play; FreeMarkerAndMustacheEmailTemplateProvider
# still falls back to mustache per-template for the ones only the parent has.
templateType=freemarker

locales=ar,ca,cs,da,de,el,en,es,fa,fr,fi,hu,it,ja,lt,nl,no,pl,pt,pt-BR,ru,sk,sv,th,tr,uk,zh-CN,zh-TW
